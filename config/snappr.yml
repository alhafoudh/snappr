# Directory snappr watches. The only path outside the project it touches, and
# the only thing it writes there is the <basename>.overlay.png beside each photo.
watch_dir: ~/Downloads

# Files snappr recognises as candidates. Anything else is ignored and never touched.
extensions: [heic, heif, jpg, jpeg]

# Print paper, in mm. Photos are cropped to this aspect ratio, object-fit: cover,
# before the overlay goes on. The long side follows the photo's own orientation,
# so a landscape photo is cropped to 148x100 and a portrait one to 100x148.
print:
  short_mm: 100
  long_mm: 148

# One overlay per orientation. Each must contain a #FF00FF rectangle marking
# where the photo goes; it is used for position and shape only and is never
# rendered. Everything else in the file is the branding. Either may be null,
# which means no overlay: the photo is still cropped to the print ratio but
# nothing is composited over it.
#
# This file is the CLI's config and nothing else reads it - the desktop app never
# calls Config.load, it sends its own settings through the sidecar handshake, and
# its overlays are picked by the operator and default to none. So the paths below
# are the dev and testing loop, and share/ is test material, not shipped branding.
overlay_svg:
  landscape: share/overlay-landscape.svg
  portrait: share/overlay-portrait.svg

# Appended to the source basename. Also the self-output guard: the watcher skips
# anything ending in this. PNG is not a watched extension either, so the output
# cannot retrigger the watcher - the guard is belt and braces.
output_suffix: .overlay.png

# Fills anything the overlay does not cover and the photo does not reach.
background: "#ffffff"

# PNG is lossless at every setting; this only trades file size against time.
# 6 is the sweet spot: 9 is measurably slower for almost no saving.
png_compression: 6

# Open the result in the default viewer once written.
open_after: true

# AirDrop writes non-atomically, so wait for size and mtime to stop changing.
stability:
  interval: 0.3
  checks: 2
  timeout: 30
