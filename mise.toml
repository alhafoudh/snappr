# The entry points an operator or a developer types. `cargo` and `npm` do the
# work; these exist so nobody has to remember which.
#
# There is no `[tools]` section any more. It pinned Ruby 3.4.5, which the pipeline
# ran on; the pipeline is Rust, and the toolchain comes from rustup and the
# `rust-version` in Cargo.toml.

[env]
# Read by nothing at runtime - it is here so a task run from a subdirectory still
# resolves the repo. The pipeline no longer needs it: `SNAPPR_ROOT` existed
# because Ruby had to find `config/snappr.yml` and `share/` relative to the
# project, and the CLI reads `~/.config/snappr/config.toml` instead.
SNAPPR_ROOT = "{{config_root}}"

[tasks.watch]
description = "watch the drop folder and overlay each photo that lands in it"
run = "cargo run --release -p snappr-cli -- watch"

[tasks.overlay]
description = "overlay the given photos now, then open them"
run = "cargo run --release -p snappr-cli -- overlay"

[tasks.inspect]
description = "report what libvips makes of a file, as JSON"
run = "cargo run --release -p snappr-cli -- inspect"

[tasks.test]
description = "the whole suite: pipeline, catalogue, settings, and the golden diff"
run = "cargo test --workspace"

[tasks.test-live]
description = "the watcher tests that drive real fsevents - slow, and worth it"
run = "cargo test --workspace -- --ignored"

[tasks.dev]
description = "run the desktop app against Vite"
run = "npm run tauri dev"

# The libvips that ships inside Snappr.app. Everything here writes only into
# build/, which is gitignored - the tasks are the source of truth, not their
# output. See docs/bundled-runtime.md.
#
# Order matters: `closure` walks the dependency closure of the libvips that
# `libvips` produces, and `verify` runs a binary linked against what `closure`
# relocated.
[tasks.runtime]
description = "build the bundled libvips, relocate its closure, and prove it is self-contained"
run = [
  "cargo xtask libvips",
  "cargo xtask closure",
  "cargo test -p snappr-core --test fixtures",
  "cargo build --release -p snappr-cli",
  "cargo xtask verify",
]

[tasks.runtime-libvips]
description = "build just libvips from source, with its format support linked in"
run = "cargo xtask libvips"

[tasks.runtime-closure]
description = "collect and relocate just the libvips dependency closure"
run = "cargo xtask closure"

[tasks.runtime-verify]
description = "run the pipeline against the bundled libvips and check nothing came from Homebrew"
run = "cargo xtask verify"

[tasks.app]
description = "build Snappr.app, with the bundled libvips inside it"
# `--config src-tauri/tauri.frameworks.json` is what puts the 45 dylibs into
# Contents/Frameworks. That file is generated by `cargo xtask closure`, because
# the task that decides which dylibs exist is the one that should write the list.
# The path is resolved against the directory the CLI runs in, which is the repo
# root, not `src-tauri/`. `--bundles app` skips the DMG that `tauri.conf.json`
# also targets: building one mounts it and opens it in Finder to lay out its
# window, on every build.
run = [
  "cargo xtask closure",
  "npm run tauri build -- --bundles app --config src-tauri/tauri.frameworks.json",
]

[tasks.install]
description = "build Snappr.app and copy it into ~/Applications, replacing the one there"
# A copy, not a symlink or an alias: Spotlight does not follow symlinks, Alfred
# does not list aliases, and neither indexes `target/`. The old bundle is removed
# first because `ditto` merges into an existing directory and would leave files a
# newer build no longer has.
depends = ["app"]
run = [
  "rm -rf \"$HOME/Applications/Snappr.app\"",
  "ditto target/release/bundle/macos/Snappr.app \"$HOME/Applications/Snappr.app\"",
]
