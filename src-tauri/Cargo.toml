[package]
name = "snappr"
version = "0.1.0"
description = "AirDrop-to-print kiosk"
authors = ["Freevision s.r.o."]
edition = "2021"
rust-version = "1.77.2"

# Capital S, and it has to be here rather than in `tauri.conf.json`. macOS takes a
# process's name - the Dock hover label and the CMD+Tab picker - from the path it
# was exec'd from, and `tauri dev` runs `cargo run`, which execs the *Cargo target*.
# `productName` names the bundle and `mainBinaryName` renames the binary while
# bundling, so neither is in play under `tauri dev`: with the target left to default
# to the package name, every development run showed up as `snappr` while the window
# title and the built `Snappr.app` were already correct. Naming the target is what
# covers both modes, and `mainBinaryName` is then unnecessary - Tauri takes the
# executable's name from here.
[[bin]]
name = "Snappr"
path = "src/main.rs"

[lib]
# The binary is a thin shell over this so the same code can be driven from tests
# and, later, from the headless subcommands.
name = "snappr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "wry" is needed for with_webview, which is how the macOS share sheet gets an
# NSView to anchor to. "protocol-asset" serves the preview JPEGs to the webview.
tauri = { version = "2", features = ["wry", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

snappr-core = { path = "../crates/snappr-core" }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
ts-rs = { workspace = true }

# The share sheet and the print dialog. Neither has first-party Tauri support
# (tauri#8063 is still open for share; Webview::print() exists but rasterises the
# DOM through WKWebView, which is the wrong pipeline for a photo). Both go through
# AppKit directly, on the main thread. Only on macOS, which is the only platform.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSGeometry", "NSString", "NSURL", "NSObject"] }
objc2-app-kit = { version = "0.3", features = [
  "NSImage", "NSImageView", "NSImageCell", "NSControl", "NSView", "NSResponder", "NSWindow",
  "NSPrintInfo", "NSPrintOperation", "NSPrintPanel", "NSSharingService", "NSGraphics",
] }

# [profile.release] lives in the workspace root now - cargo ignores profiles on a
# non-root member and says so on every build.
